[package]
name = "tunward-cli"
version = "11.0.0"
edition = "2024"
authors = ["Fahmi Kemal <fahmi@kemal.id>"]
repository = "https://github.com/fahmikemal/tunward.git"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
fdlimit = "0.3.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "local-time"] }
tunward = { path = "../tunward", default-features = false, features = ["clap"] }

tikv-jemallocator = { version = "0.7", optional = true }

[features]
default = ["aws-lc-rs"]
jemalloc = ["dep:tikv-jemallocator"]
aws-lc-rs = ["tunward/aws-lc-rs"]
ring = ["tunward/ring"]
aws-lc-rs-bindgen = ["tunward/aws-lc-rs-bindgen"]

[[bin]]
name = "tunward"
path = "src/main.rs"
