# cargo-deny policy for the dependency graph: advisories, licenses, duplicate or wildcard
# requirements, and where crates may come from. Run with `cargo deny --locked check`.

[graph]
# Release builds enable jemalloc, ring and bindgen, so check every feature's dependencies.
all-features = true

[advisories]
# Unmaintained crates are reported anywhere in the graph and fail the check. Yanked releases are refused.
yanked = "deny"
# testcontainers 0.28.0 (the latest release) requires this deprecated archiver.
# It is absent from the CLI's normal/build graph. Keep this maintenance-only
# exception narrow and remove it when testcontainers replaces the dependency.
# Vulnerability advisories remain denied, including for development dependencies.
ignore = [
  { id = "RUSTSEC-2026-0440", reason = "Test-only astral-tokio-tar through testcontainers 0.28.0; no upstream replacement release is available and the archiver is not shipped in the CLI." },
]

[licenses]
# Permissive licenses actually present in the graph. Copyleft terms such as LGPL-2.1-or-later only
# appear as one alternative of an OR expression, which a permitted license satisfies.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "warn"

[bans]
# Several crates legitimately exist in two versions during ecosystem migrations; keep them visible.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
