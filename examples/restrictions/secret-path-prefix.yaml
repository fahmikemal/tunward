# Allow every tunnel, but only for clients using the path prefix my-super-secret-path.
# An explicit {} means "any"; a bare !Tunnel with no body is refused.
restrictions:
  - name: "Everything behind a secret path"
    match:
      - !PathPrefix "^my-super-secret-path$"
    allow:
      - !Tunnel {}
      - !ReverseTunnel {}
