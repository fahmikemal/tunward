[tools]
#docker-cli = "latest"
#rust = "1.93"

[tasks.test]
description = "Run all the tests. Requires docker"
# Not --all-features: it turns on both `aws-lc-rs` and `ring`, which forward the two mutually
# exclusive crypto providers of jsonwebtoken, and the tests then panic at runtime.
run = "cargo nextest run"

[tasks.bump-deps]
description = "Upgrade all libs versions for all packages"
run = """
  cargo upgrade --recursive true --incompatible allow
  cargo update --recursive
"""

[tasks.linter-fix]
description = "Fix linter issues when possible and format code"
run = """
   cargo clippy --fix --all-features --locked --allow-dirty
   cargo fmt --all
"""

[tasks.docker-release]
description = "Build and push tunward docker image"
usage = '''
arg "image_tag" "tag of the image"
'''
run = """
 docker buildx create  --name builder  --driver=kubernetes --platform=linux/arm64   '--driver-opt="nodeselector=kubernetes.io/arch=arm64","tolerations=key=kubernetes.io/hostname,value=server","requests.cpu=16","requests.memory=16G"' --node=build-arm64
 docker buildx create --append --name builder  --driver=kubernetes --platform=linux/amd64   '--driver-opt="nodeselector=kubernetes.io/arch=amd64","tolerations=key=kubernetes.io/hostname,value=toybox","requests.cpu=16","requests.memory=16G"' --node=build-amd64
 docker buildx use builder
 docker buildx build \
   --platform linux/arm/v7,linux/arm64,linux/amd64 \
   --cache-from type=registry,ref=ghcr.io/fahmikemal/tunward:cache \
   --cache-to type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=ghcr.io/fahmikemal/tunward:cache \
   -t ghcr.io/fahmikemal/tunward:$usage_image_tag \
   -t ghcr.io/fahmikemal/tunward:latest \
   --push .
 docker buildx rm builder
"""

[tasks.release-prepare]
description = "Open a pull request that bumps both packages to VERSION; main accepts changes only through pull requests"
usage = 'arg "<version>" help="the version without the v prefix, such as 0.1.0-beta.3"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="${usage_version:?}"
tag="v$version"
branch="release/$tag"
if ! git diff --quiet || ! git diff --cached --quiet; then
  echo "Commit or stash local changes first" >&2
  exit 1
fi
git fetch --quiet origin
git switch --quiet --create "$branch" origin/main
python3 - "$version" <<'PY'
import re, sys
from pathlib import Path
for manifest in ("tunward/Cargo.toml", "tunward-cli/Cargo.toml"):
    path = Path(manifest)
    text, count = re.subn(r'(?m)^version = ".*"$', f'version = "{sys.argv[1]}"', path.read_text(), count=1)
    if count != 1:
        sys.exit(f"{manifest}: no package version line")
    path.write_text(text)
PY
# Refresh the two packages' entries in Cargo.lock, and refuse a version the release workflow would reject.
cargo metadata --format-version 1 > /dev/null
python3 scripts/check_release_tag.py --ref "refs/tags/$tag" > /dev/null
git add tunward/Cargo.toml tunward-cli/Cargo.toml Cargo.lock
git commit --quiet -m "chore(release): bump version to $version"
git push --quiet --set-upstream origin "$branch"
gh pr create --base main --head "$branch" --title "chore(release): bump version to $version" \
  --body "Bumps tunward and tunward-cli to $version. Once this is merged and CI on main passes, run \`mise run release-tag $version\`."
'''

[tasks.release-tag]
description = "Tag main as vVERSION once the version bump is merged and CI on main passed; pushes only the tag"
usage = 'arg "<version>" help="the version without the v prefix, such as 0.1.0-beta.3"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="${usage_version:?}"
tag="v$version"
git fetch --quiet --tags origin
git switch --quiet main
git merge --ff-only --quiet origin/main
# Published release tags are never moved or reused.
if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
  echo "$tag already exists" >&2
  exit 1
fi
python3 scripts/check_release_tag.py --ref "refs/tags/$tag" > /dev/null
head=$(git rev-parse HEAD)
conclusion=$(gh run list --workflow ci.yaml --branch main --commit "$head" --json conclusion --jq '.[0].conclusion // ""')
if [ "$conclusion" != success ]; then
  echo "CI on main $head is '${conclusion:-not run}', not success; wait for it before tagging" >&2
  exit 1
fi
git tag --annotate "$tag" --message "version $tag" "$head"
git push origin "refs/tags/$tag"
echo "Pushed $tag; the release workflow now builds, attests and publishes it"
'''

[tasks.bench]
description = "End-to-end benchmark with iperf3 (throughput, cpu, memory). See docs/BENCHMARKING.md"
usage = 'flag "--args <args>" help="passed through to scripts/bench.sh"'
run = "./scripts/bench.sh $usage_args"
