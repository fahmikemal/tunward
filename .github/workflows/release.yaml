name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99"
  BIN_NAME: "tunward"

jobs:
  release-tag:
    name: Validate release tag and publication credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a version tag matching both packages
        id: tag
        run: python3 scripts/check_release_tag.py >> "$GITHUB_OUTPUT"
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set the DOCKERHUB_USERNAME repository variable'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set the DOCKERHUB_TOKEN Actions secret'; exit 1; }

  native-runtime:
    needs: release-tag
    uses: ./.github/workflows/runtime-qualification.yaml

  # Runs alongside the build matrix, so a formatting or test failure is reported without
  # waiting on the cross-compilation of every platform.
  check:
    name: Check - format, lint & tests
    needs: release-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
          components: rustfmt, clippy

      - name: Install taplo-cli and cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: taplo-cli,cargo-nextest

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Reject private keys in reachable publication history
        run: python3 scripts/check_publication.py --history

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check TOML formatting
        run: taplo fmt --check

      - name: Lint
        run: cargo clippy --all --all-features --locked -- -D warnings

      # Validate each shipped TLS provider separately.
      - name: Test with aws-lc-rs
        run: cargo nextest run --locked

      # What the armv7, armv6, freebsd and windows-x86 builds ship with.
      - name: Test with ring
        run: cargo nextest run --locked --no-default-features --features ring,fleet-inventory

  build:
    name: Build - ${{ matrix.platform.name }}
    needs: [ check, native-runtime ]
    # By default, runs on Ubuntu, otherwise, override with the desired os
    runs-on: ${{ matrix.platform.os || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Set platforms you want to build your binaries on
        platform:
          # Linux
          - name: Linux x86_64
            target: x86_64-unknown-linux-musl
            build-args: "--release --features=jemalloc"

          - name: Linux x86
            target: i686-unknown-linux-musl
            build-args: "--release --features aws-lc-rs-bindgen"

          - name: Linux aarch64
            target: aarch64-unknown-linux-musl
            build-args: "--release --features=jemalloc -vv"
          - name: Linux armv7hf
            target: armv7-unknown-linux-musleabihf
            build-args: "--release --no-default-features --features ring,fleet-inventory"

          - name: Linux armv6
            target: arm-unknown-linux-musleabihf
            build-args: "--release --no-default-features --features ring,fleet-inventory"

          - name: Freebsd x86_64
            target: x86_64-unknown-freebsd
            build-args: "--release --no-default-features --features ring,fleet-inventory --features=jemalloc"

          - name: Freebsd x86
            target: i686-unknown-freebsd
            build-args: "--release --no-default-features --features ring,fleet-inventory"

          - name: Android aarch64
            target: aarch64-linux-android
            build-args: "--release --features=jemalloc"

          - name: Android armv7
            target: armv7-linux-androideabi
            build-args: "--release --no-default-features --features ring,fleet-inventory"

          #- name: Linux mips
          #  target: mips-unknown-linux-musl

          #- name: Linux mips64
          #  target: mips64-unknown-linux-muslabi64

          # Mac OS
          - name: MacOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            build-args: "--release --features=jemalloc"

          - name: MacOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            build-args: "--release --features=jemalloc"

          # - name: iOS x86_64
          #   target: x86_64-apple-ios


          #- name: iOS aarch64
          #  target: aarch64-apple-ios


          # Windows
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            build-args: "--profile release-with-symbols"

          - name: Windows x86
            os: windows-2022
            target: i686-pc-windows-msvc
            build-args: "--profile release-with-symbols --no-default-features --features ring,fleet-inventory"

          - name: Windows aarch64
            os: windows-2022
            target: aarch64-pc-windows-msvc
            build-args: "--profile release-with-symbols"

    steps:

      - name: Install package for linux
        if: contains(matrix.platform.target, 'linux')
        run: sudo apt install musl-tools

      - name: Install package for Android
        if: contains(matrix.platform.target, 'android')
        run: sudo apt install android-libunwind android-libunwind-dev libunwind-dev

      - name: Set up JDK 17
        if: contains(matrix.platform.target, 'android')
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: contains(matrix.platform.target, 'android')
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
          targets: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - name: Install pinned cross compiler driver
        if: (contains(matrix.platform.target, 'linux') && !contains(matrix.platform.target, 'x86_64')) || contains(matrix.platform.target, 'freebsd')
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev 526d03ddcd2f70e683074b3ea6f75ed300f33132

      - name: Install bindgen-cli
        if: contains(matrix.platform.build-args, 'aws-lc-rs-bindgen')
        run: cargo install bindgen-cli --locked --version 0.73.2

      - name: Build ${{ matrix.platform.name }} binary
        shell: bash
        env:
          JEMALLOC_SYS_WITH_LG_PAGE: ${{ contains(matrix.platform.target, 'aarch64') && '14' || '12' }}
          USE_CROSS: ${{ (contains(matrix.platform.target, 'linux') && !contains(matrix.platform.target, 'x86_64')) || contains(matrix.platform.target, 'freebsd') }}
          BUILD_ARGS: ${{ matrix.platform.build-args }}
          BUILD_TARGET: ${{ matrix.platform.target }}
        run: |
          driver=cargo
          if [[ "$USE_CROSS" == true ]]; then driver=cross; fi
          read -r -a build_args <<< "$BUILD_ARGS"
          "$driver" build "${build_args[@]}" --locked --bin tunward --target "$BUILD_TARGET"

      - name: Store artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Finally, we store the binary as GitHub artifact for later usage
          name: ${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release${{ contains(matrix.platform.target, 'windows') && '-with-symbols' || '' }}/${{ env.BIN_NAME }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
          retention-days: 1

  docker:
    name: Publish Docker Hub image
    needs: [ release-tag, build ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: docker.io/oph1uchus/tunward
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tunward-x86_64-unknown-linux-musl
          path: target/docker-release/artifacts/linux/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tunward-aarch64-unknown-linux-musl
          path: target/docker-release/artifacts/linux/arm64
      - name: Prepare minimal image context
        run: cp Dockerfile.release LICENSE target/docker-release/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 image for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/docker-release
          file: target/docker-release/Dockerfile.release
          platforms: linux/amd64
          load: true
          tags: tunward-release-test:amd64
      - name: Build arm64 image for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/docker-release
          file: target/docker-release/Dockerfile.release
          platforms: linux/arm64
          load: true
          tags: tunward-release-test:arm64
      - name: Check both image architectures before publication
        run: |
          for arch in amd64 arm64; do
            image="tunward-release-test:$arch"
            test "$(docker image inspect "$image" --format '{{.Config.User}}')" = '10001:10001'
            docker run --rm --platform "linux/$arch" --network none --read-only --cap-drop ALL \
              "$image" /home/app/tunward --version | grep -Fx "tunward-cli ${RELEASE_TAG#v}"
            docker run --rm --platform "linux/$arch" --network none --read-only --cap-drop ALL \
              "$image" /home/app/tunward --help > /dev/null
          done
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish versioned multi-platform image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/docker-release
          file: target/docker-release/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Record published image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Published $IMAGE:$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: [ build, docker ]
    if: startsWith( github.ref, 'refs/tags/v' )
    permissions:
      contents: write
      # Sign build provenance attestations for the published archives.
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release binaries only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tunward-*
          merge-multiple: false
          path: artifacts

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Verify binary set and restore executable permissions
        run: python3 scripts/check_release_artifacts.py --artifacts artifacts

      - name: Package verified Rust binaries
        run: |
          python3 scripts/package_release.py --artifacts artifacts --output dist \
            --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_RUN_ID: ${{ github.run_id }}

      # Before publication, so a failed attestation leaves nothing published without provenance.
      # Verify a download with: gh attestation verify <archive> --repo fahmikemal/tunward
      - name: Attest build provenance of the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # The same files and options as package_release.py --publish.
      - name: Publish the attested release files
        run: |
          options=(--verify-tag --latest=false --title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" "${options[@]}"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
