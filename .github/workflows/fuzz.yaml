# Fuzzes the parsers of what peers send: briefly on a pull request that can change them, and longer
# every week so that the search goes deeper. A crash fails the run and keeps its input as an artifact.
name: Fuzz

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/fuzz.yaml"
      - "Cargo.lock"
      - "fuzz/**"
      - "rust-toolchain.toml"
      - "scripts/fuzz.sh"
      - "tunward/Cargo.toml"
      - "tunward/src/**"
  schedule:
    - cron: "15 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: true
        default: "300"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99"
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "${{ env.RUST_VERSION }}"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Fuzz each target
        run: ./scripts/fuzz.sh "$SECONDS_PER_TARGET"
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || (github.event_name == 'schedule' && '300') || '60' }}

      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
