name: CI

on:
  push:
    branches: [ "main", "draft" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.97

jobs:
  native-runtime:
    uses: ./.github/workflows/runtime-qualification.yaml

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  scan-and-lint:
    name: Lint, Format & RustSec Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
          components: rustfmt, clippy

      - name: Install taplo-cli
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check TOML formatting
        run: taplo fmt --check

      - name: Verify release tag guards
        run: python3 -m unittest discover -s scripts -p test_check_release_tag.py

      - name: Lint with Clippy
        run: cargo clippy --all --all-features --locked -- -D warnings

      - name: Security Vulnerability Scan (cargo-audit)
        uses: actions-rust-lang/audit@v1

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.RUST_VERSION }}"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test with aws-lc-rs
        run: cargo nextest run --locked

      - name: Test with ring
        run: cargo nextest run --locked --no-default-features --features ring

  qualification:
    name: Local protocol and security regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p tunward-cli
      - name: Smoke-test release image packaging without publication
        timeout-minutes: 5
        run: |
          context="$RUNNER_TEMP/tunward-image-context"
          mkdir -p "$context/artifacts/linux/amd64"
          cp target/release/tunward "$context/artifacts/linux/amd64/"
          cp Dockerfile.release LICENSE "$context/"
          docker build --build-arg TARGETARCH=amd64 -f "$context/Dockerfile.release" -t tunward-container:ci "$context"
          test "$(docker image inspect tunward-container:ci --format '{{.Config.User}}')" = '10001:10001'
          docker run --rm --network none --read-only --cap-drop ALL tunward-container:ci /home/app/tunward --version
          docker run --rm --network none --read-only --cap-drop ALL tunward-container:ci /home/app/tunward --help > /dev/null
      - name: Qualify transports and security
        timeout-minutes: 15
        run: python3 scripts/qualify.py --sections protocols,fleet,security,extended,isolation,soak,lifecycle,rotation --devices 32 --idle 128 --hold 5
      - name: Qualify certificate identity and device isolation
        timeout-minutes: 5
        run: python3 scripts/qualify_identity.py --output target/qualification/identity
      - name: Verify delayed TLS pool deadline behavior
        timeout-minutes: 2
        run: python3 scripts/qualify_pool_timeout.py --output target/qualification/pool-delay
      - name: Qualify authenticated device quotas
        timeout-minutes: 5
        run: python3 scripts/qualify_quotas.py --output target/qualification/quotas
      - name: Qualify live certificate and device revocation
        timeout-minutes: 5
        run: python3 scripts/qualify_revocation.py --output target/qualification/revocation
      - name: Qualify fleet transport parity and persistent inventory
        timeout-minutes: 5
        run: python3 scripts/qualify_fleet.py --output target/qualification/fleet
      - name: Qualify tenant scope and reverse ownership
        timeout-minutes: 5
        run: python3 scripts/qualify_tenants.py --output target/qualification/tenants
      - name: Check publication tree for PEM private keys
        run: python3 scripts/check_publication.py
      - name: Verify endurance evidence and supervisor shutdown
        run: python3 -m unittest discover -s scripts -p 'test_*endurance.py'
      - name: Qualify synthetic verified-device admission
        run: python3 scripts/qualify_device_scale.py --devices 200 --output target/qualification/device-scale
      - name: Qualify certificate renewal and rollback
        timeout-minutes: 5
        run: python3 scripts/qualify_pki.py --output target/qualification/pki
      - name: Install controlled DNS test dependencies
        run: python3 -m pip install -r scripts/requirements-qualification.txt
      - name: Qualify DNS and ECH edge cases
        timeout-minutes: 5
        run: python3 scripts/qualify_dns.py --output target/qualification/dns
      - name: Qualify isolated privileged IPv4 TProxy
        timeout-minutes: 5
        run: |
          status=0
          sudo python3 scripts/qualify_tproxy.py --output target/qualification/tproxy || status=$?
          sudo chown -R "$(id -u):$(id -g)" target/qualification/tproxy
          exit "$status"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-evidence
          path: |
            target/qualification/**/results.json
            target/qualification/**/metadata.json
            target/qualification/**/*.log
