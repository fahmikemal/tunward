name: CI

on:
  push:
    branches: [ "main", "draft" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99"
  # Test client only: the runner's OpenSSL 3.0 has no QUIC client to drive WebTransport handshakes.
  # The system library stays untouched; this build lives in its own prefix.
  OPENSSL_QUIC_VERSION: 3.5.9
  OPENSSL_QUIC_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a

jobs:
  native-runtime:
    uses: ./.github/workflows/runtime-qualification.yaml

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Lists the pull request's commits to scan only those.
      pull-requests: read
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every finding fails the job. The excluded JavaScript rule only matches the ws:// scheme here:
      # cleartext WebSocket is a supported transport, limited to loopback or --allow-insecure-dev
      # and covered by the secure-defaults tests. Other intentional patterns carry nosemgrep notes.
      - name: Run Semgrep SAST
        run: >-
          semgrep scan --config auto --error --metrics on
          --exclude-rule javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket

  scan-and-lint:
    name: Lint, Format & RustSec Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
          components: rustfmt, clippy

      - name: Install taplo-cli and cargo-deny
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: taplo-cli,cargo-deny@0.20.2

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check that every Rust toolchain pin matches rust-toolchain.toml
        run: python3 scripts/check_toolchain_pins.py

      # Before Clippy, whose failure for this case is an opaque syn::File trait error inside bindgen.
      - name: Check that locked crates share prettyplease's syn version
        run: python3 scripts/check_prettyplease_syn.py

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check TOML formatting
        run: taplo fmt --check

      - name: Verify release tag guards
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_release*.py'
          python3 -m unittest discover -s scripts -p test_package_release.py
          python3 -m unittest discover -s scripts -p test_check_toolchain_pins.py
          python3 -m unittest discover -s scripts -p test_check_prettyplease_syn.py

      - name: Verify issue templates pass the auto-close workflow
        run: python3 -m unittest discover -s scripts -p test_issue_templates.py

      - name: Lint with Clippy
        run: |
          cargo clippy --all --all-features --locked -- -D warnings
          # The data-plane build without the SQLite fleet inventory.
          cargo clippy --all --all-targets --locked --no-default-features --features aws-lc-rs -- -D warnings

      - name: Check advisories, licenses, bans and sources (cargo-deny)
        run: cargo deny --locked check

      - name: Security Vulnerability Scan (cargo-audit)
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "${{ env.RUST_VERSION }}"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test with aws-lc-rs
        run: cargo nextest run --locked

      - name: Test with ring
        run: cargo nextest run --locked --no-default-features --features ring,fleet-inventory

      - name: Test without the fleet inventory
        run: |
          if cargo tree --locked -p tunward-cli --no-default-features --features aws-lc-rs -e normal,build | grep -E 'rusqlite|libsqlite3-sys'; then
            echo "SQLite is still linked without the fleet-inventory feature"
            exit 1
          fi
          cargo nextest run --locked -p tunward --no-default-features --features aws-lc-rs

  qualification:
    name: Local protocol and security regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Isolate qualification evidence from the build cache
        run: |
          echo "QUALIFICATION_ROOT=$RUNNER_TEMP/tw-q-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          python3 -c "from pathlib import Path; import shutil; p = Path('target/qualification'); shutil.rmtree(p) if p.exists() else None"
      - name: Build release binary
        run: cargo build --release --locked -p tunward-cli
      - name: Verify offline server configuration checks and documented options
        run: |
          python3 -m unittest discover -s scripts -p test_server_config.py -v
          python3 -m unittest discover -s scripts -p test_documented_flags.py -v
      - name: Smoke-test release image packaging without publication
        timeout-minutes: 5
        run: |
          context="$RUNNER_TEMP/tunward-image-context"
          mkdir -p "$context/artifacts/linux/amd64"
          cp target/release/tunward "$context/artifacts/linux/amd64/"
          cp Dockerfile.release LICENSE "$context/"
          docker build --build-arg TARGETARCH=amd64 -f "$context/Dockerfile.release" -t tunward-container:ci "$context"
          test "$(docker image inspect tunward-container:ci --format '{{.Config.User}}')" = '10001:10001'
          docker run --rm --network none --read-only --cap-drop ALL tunward-container:ci /home/app/tunward --version
          docker run --rm --network none --read-only --cap-drop ALL tunward-container:ci /home/app/tunward --help > /dev/null
          # The image's own default command serves with the documented files mounted and refuses without them.
          python3 scripts/qualify_container_defaults.py --image tunward-container:ci --output "$QUALIFICATION_ROOT/container"
      - name: Qualify transports and security
        timeout-minutes: 15
        run: python3 scripts/qualify.py --sections protocols,fleet,security,extended,isolation,soak,lifecycle,rotation --devices 32 --idle 128 --hold 5 --output "$QUALIFICATION_ROOT/main"
      - name: Qualify acknowledged configuration reload under live traffic
        timeout-minutes: 5
        run: python3 scripts/qualify_reload.py --output "$QUALIFICATION_ROOT/reload"
      - name: Qualify certificate identity and device isolation
        timeout-minutes: 5
        run: python3 scripts/qualify_identity.py --output "$QUALIFICATION_ROOT/identity"
      - name: Verify delayed TLS pool deadline behavior
        timeout-minutes: 2
        run: python3 scripts/qualify_pool_timeout.py --output "$QUALIFICATION_ROOT/pool-delay"
      - name: Restore the OpenSSL QUIC test client
        id: openssl-quic
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/openssl-quic
          key: openssl-quic-${{ env.OPENSSL_QUIC_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build the OpenSSL QUIC test client
        if: steps.openssl-quic.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          source="$RUNNER_TEMP/openssl-$OPENSSL_QUIC_VERSION.tar.gz"
          curl -fsSLo "$source" "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_QUIC_VERSION/openssl-$OPENSSL_QUIC_VERSION.tar.gz"
          echo "$OPENSSL_QUIC_SHA256  $source" | sha256sum -c -
          tar -xzf "$source" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-$OPENSSL_QUIC_VERSION"
          ./Configure --prefix="$HOME/.cache/openssl-quic" --libdir=lib no-shared no-docs no-tests
          make -j"$(nproc)"
          make install_sw
      - name: Qualify destination CIDR confinement and pre-authentication bounds
        timeout-minutes: 8
        run: >-
          python3 scripts/qualify_hardening.py --output "$QUALIFICATION_ROOT/hardening"
          --openssl "$HOME/.cache/openssl-quic/bin/openssl" --require-quic
      - name: Qualify authenticated device quotas
        timeout-minutes: 5
        run: python3 scripts/qualify_quotas.py --output "$QUALIFICATION_ROOT/quotas"
      - name: Qualify live certificate and device revocation
        timeout-minutes: 5
        run: python3 scripts/qualify_revocation.py --output "$QUALIFICATION_ROOT/revocation"
      - name: Qualify fleet transport parity and persistent inventory
        timeout-minutes: 5
        run: python3 scripts/qualify_fleet.py --output "$QUALIFICATION_ROOT/fleet"
      - name: Qualify tenant scope and reverse ownership
        timeout-minutes: 5
        run: python3 scripts/qualify_tenants.py --output "$QUALIFICATION_ROOT/tenants"
      - name: Qualify forwarded addresses, reverse destinations, listener binds and development quotas
        timeout-minutes: 5
        run: python3 scripts/qualify_trust_boundaries.py --output "$QUALIFICATION_ROOT/trust"
      - name: Check publication tree for PEM private keys
        run: python3 scripts/check_publication.py
      - name: Verify endurance evidence and supervisor shutdown
        run: python3 -m unittest discover -s scripts -p 'test_*endurance.py'
      - name: Qualify synthetic verified-device admission
        run: python3 scripts/qualify_device_scale.py --devices 200 --output "$QUALIFICATION_ROOT/device-scale"
      - name: Qualify certificate renewal and rollback
        timeout-minutes: 5
        run: python3 scripts/qualify_pki.py --output "$QUALIFICATION_ROOT/pki"
      - name: Install controlled DNS test dependencies
        run: python3 -m pip install -r scripts/requirements-qualification.txt
      - name: Qualify DNS and ECH edge cases
        timeout-minutes: 5
        run: python3 scripts/qualify_dns.py --output "$QUALIFICATION_ROOT/dns"
      - name: Qualify isolated privileged IPv4 and IPv6 TProxy
        timeout-minutes: 5
        run: |
          status=0
          sudo python3 scripts/qualify_tproxy.py --output "$QUALIFICATION_ROOT/tproxy" || status=$?
          sudo chown -R "$(id -u):$(id -g)" "$QUALIFICATION_ROOT/tproxy"
          exit "$status"
      - name: Preserve qualification evidence
        if: always() && env.QUALIFICATION_ROOT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-evidence
          path: |
            ${{ env.QUALIFICATION_ROOT }}/**/results.json
            ${{ env.QUALIFICATION_ROOT }}/**/metadata.json
            ${{ env.QUALIFICATION_ROOT }}/**/*.log
