# OpenSSF Scorecard, weekly and on every push to main: the results are published to scorecard.dev
# and uploaded to code scanning. With publish_results the Scorecard service accepts only a
# workflow shaped like its template (no workflow or job env, no container or services, and only
# these steps), which is why this job runs on ubuntu-latest rather than a pinned image.
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Sign the published results with the workflow's OIDC identity.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
