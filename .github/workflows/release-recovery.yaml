name: Recover prerelease assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease tag whose GitHub release packaging failed
        required: true
        type: string
      source_run_id:
        description: Failed Release run with successful checks, binary builds, and Docker publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: Release-refs/tags/${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout recovery controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Checkout existing tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          path: release-source
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate tag, source run, prerequisites, and absence of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 control/scripts/check_release_artifacts.py --source release-source \
            --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID"
          cd release-source
          python3 scripts/check_publication.py --history
      - name: Download only the previously built binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tunward-*
          merge-multiple: false
          path: release-source/artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded set and restore executable permissions
        run: python3 control/scripts/check_release_artifacts.py --artifacts release-source/artifacts
      - name: Package and publish the existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 control/scripts/package_release.py --source release-source \
            --artifacts release-source/artifacts --output release-source/dist \
            --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID" --publish
