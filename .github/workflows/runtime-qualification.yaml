name: Native runtime qualification

on:
  workflow_call:

permissions:
  contents: read

env:
  RUST_VERSION: "1.97"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "${{ env.RUST_VERSION }}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Remove legacy qualification fixtures restored with the build cache
        run: python -c "from pathlib import Path; import shutil; p = Path('target/qualification'); shutil.rmtree(p) if p.exists() else None"
      - name: Use Git OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Build native ring binary
        run: cargo build --release --locked -p tunward-cli --no-default-features --features ring
      - name: Verify portable certificate generation and setup evidence
        run: python -m unittest discover -s scripts -p test_qualify_runtime.py
      - name: Verify offline server configuration checks
        run: python -m unittest discover -s scripts -p test_server_config.py -v
      - name: Exercise native transport runtime
        run: python scripts/qualify_runtime.py --output "${{ runner.temp }}/tunward-native-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Exercise native Unix configuration reload
        if: runner.os != 'Windows'
        run: python scripts/qualify_reload.py --output "${{ runner.temp }}/tunward-native-${{ github.run_id }}-${{ github.run_attempt }}/reload"
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/tunward-native-${{ github.run_id }}-${{ github.run_attempt }}/results.json
            ${{ runner.temp }}/tunward-native-${{ github.run_id }}-${{ github.run_attempt }}/metadata.json
            ${{ runner.temp }}/tunward-native-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/tunward-native-${{ github.run_id }}-${{ github.run_attempt }}/reload/results.json
            ${{ runner.temp }}/tunward-native-${{ github.run_id }}-${{ github.run_attempt }}/reload/metadata.json
            ${{ runner.temp }}/tunward-native-${{ github.run_id }}-${{ github.run_attempt }}/reload/*.log
