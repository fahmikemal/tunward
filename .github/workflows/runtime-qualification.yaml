name: Native runtime qualification

on:
  workflow_call:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - name: Use Git OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Build native ring binary
        run: cargo build --release --locked -p tunward-cli --no-default-features --features ring
      - name: Exercise native transport runtime
        run: python scripts/qualify_runtime.py --output target/qualification/native-runtime
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-${{ matrix.os }}
          path: |
            target/qualification/native-runtime/results.json
            target/qualification/native-runtime/metadata.json
            target/qualification/native-runtime/*.log
