on:
  issues:
    types: [opened, edited]

concurrency:
  group: auto-close-${{ github.event.issue.number }}

jobs:
  auto_close_issues:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Automatically close issues that don't follow the issue template
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            if (issue.state !== "open") {
              return;
            }
            // The first section of each template in .github/ISSUE_TEMPLATE.
            const template = /^## (Observed behavior|Problem|Goal)\s*$/m;
            if (template.test(issue.body ?? "")) {
              return;
            }
            const params = { ...context.repo, issue_number: issue.number };
            await github.rest.issues.createComment({
              ...params,
              body: `Hello @${issue.user.login} :wave:\n\nThis issue is being automatically closed because it does not follow the issue template.`,
            });
            await github.rest.issues.update({ ...params, state: "closed", state_reason: "not_planned" });
