# Keeps the SHA-pinned actions, crates, base images and Python test dependencies current.
# Updates are grouped per ecosystem so routine bumps arrive as one pull request. Version updates
# wait seven days after a release so a compromised or broken publish can be pulled first; security
# updates are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(docker)

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
